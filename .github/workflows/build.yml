name: Build APK and Linux Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Create Flutter local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Stellar Center v$VERSION"

      # --- ANDROID DERLEMESİ ---
      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk

      # --- LINUX / PARDUS DERLEMESİ ---
      - name: Create Linux Platform Files
        run: flutter create --platforms=linux .

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ${{ github.workspace }}/stellar-center-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.version.outputs.version }}
          path: stellar-center-linux-x64.tar.gz

      # --- GITHUB RELEASE (Hem APK hem Linux paketini yayınlar) ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}
          body: |
            Stellar Center v${{ steps.version.outputs.version }}

            * Android release APK
            * Linux / Pardus release bundle (.tar.gz)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            stellar-center-linux-x64.tar.gz
          make_latest: true
          overwrite_files: true

      - name: Clean and Recreate Linux
        run: |
          rm -rf linux
          flutter create --platforms=linux .
