name: Build APK and Linux Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stellar Center v$VERSION"

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk


  linux:
    name: Build Linux / Pardus 23
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            file \
            ca-certificates \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            dpkg-dev \
            openjdk-17-jdk

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        shell: bash
        run: |
          git clone \
            --branch 3.24.0 \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            /opt/flutter

          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

          export PATH="/opt/flutter/bin:$PATH"

          flutter config --enable-linux-desktop
          flutter --version

      - name: Create Linux platform
        shell: bash
        run: |
          rm -rf linux

          flutter create \
            --platforms=linux \
            --project-name=stellarcenter \
            .

      - name: Get dependencies
        shell: bash
        run: flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stellar Center Linux v$VERSION"

      - name: Build Linux
        shell: bash
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release

      - name: Verify Linux
        shell: bash
        run: |
          test -d build/linux/x64/release/bundle
          test -f build/linux/x64/release/bundle/stellarcenter

          ls -lh build/linux/x64/release/bundle/

      - name: Create TAR.GZ
        shell: bash
        run: |
          tar -czf \
            stellar-center-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle \
            .

      - name: Verify TAR.GZ
        shell: bash
        run: |
          test -f stellar-center-linux-x64.tar.gz
          ls -lh stellar-center-linux-x64.tar.gz

      - name: Upload TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-linux-${{ steps.version.outputs.version }}
          path: stellar-center-linux-x64.tar.gz

      - name: Create DEB
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf deb-package

          mkdir -p \
            "deb-package/DEBIAN" \
            "deb-package/opt/stellarcenter" \
            "deb-package/usr/share/applications" \
            "deb-package/usr/share/icons/hicolor/256x256/apps"

          cp -r \
            build/linux/x64/release/bundle/. \
            "deb-package/opt/stellarcenter/"

          cat > "deb-package/DEBIAN/control" <<EOF
Package: stellarcenter
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: TechyTR
Depends: libc6, libgtk-3-0
Description: Stellar Center
 Stellar Center system utility application for Linux and Pardus.
EOF

          cat > "deb-package/usr/share/applications/stellarcenter.desktop" <<EOF
[Desktop Entry]
Name=Stellar Center
Comment=Stellar Center system utility application
Exec=/opt/stellarcenter/stellarcenter
Icon=stellarcenter
Terminal=false
Type=Application
Categories=Utility;System;
EOF

          if [ -f "assets/icon.png" ]; then
            cp \
              assets/icon.png \
              "deb-package/usr/share/icons/hicolor/256x256/apps/stellarcenter.png"
          fi

      - name: Build DEB
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-package \
            "stellar-center_${VERSION}_amd64.deb"

      - name: Verify DEB
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          test -f "stellar-center_${VERSION}_amd64.deb"

          dpkg-deb \
            --info \
            "stellar-center_${VERSION}_amd64.deb"

          ls -lh "stellar-center_${VERSION}_amd64.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-deb-${{ steps.version.outputs.version }}
          path: stellar-center_${{ steps.version.outputs.version }}_amd64.deb


  release:
    name: Create GitHub Release
    needs:
      - android
      - linux

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*$/\1/p' pubspec.yaml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-apk-${{ steps.version.outputs.version }}
          path: release-files/apk

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-linux-${{ steps.version.outputs.version }}
          path: release-files/linux

      - name: Download DEB
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-deb-${{ steps.version.outputs.version }}
          path: release-files/deb

      - name: Verify release files
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          test -f release-files/apk/app-release.apk
          test -f release-files/linux/stellar-center-linux-x64.tar.gz
          test -f "release-files/deb/stellar-center_${VERSION}_amd64.deb"

          echo "All release files are ready."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}

          body: |
            # Stellar Center v${{ steps.version.outputs.version }}

            ## Downloads

            ### Android
            - Stellar Center APK

            ### Linux / Pardus 23
            - Linux x64 TAR.GZ
            - Debian / Pardus AMD64 DEB

            ## Compatibility

            Linux binaries are built inside Debian 12
            for compatibility with Pardus 23.

          files: |
            release-files/apk/app-release.apk
            release-files/linux/stellar-center-linux-x64.tar.gz
            release-files/deb/stellar-center_${{ steps.version.outputs.version }}_amd64.deb

          make_latest: true
          overwrite_files: true
