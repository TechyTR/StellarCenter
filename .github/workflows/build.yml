name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Stellar Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android toolchain
        working-directory: android
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not generated."
            find android/app/build/outputs -type f -maxdepth 5 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from android/app/build.gradle"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Stellar Center v$VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-center-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}
          body: |
            Stellar Center v${{ steps.version.outputs.version }}

            Native Android release built with Kotlin and Jetpack Compose.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true

