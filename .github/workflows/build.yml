name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stellar-center-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Stellar Center
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-37.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify native Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Native Kotlin Android project detected."

      - name: Read current version
        id: current_version
        shell: bash
        run: |
          set -e

          BUILD_FILE="android/app/build.gradle"

          CURRENT_VERSION=$(
            sed -n \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$BUILD_FILE" |
              head -n 1
          )

          CURRENT_VERSION_CODE=$(
            sed -n \
              's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
              "$BUILD_FILE" |
              head -n 1
          )

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read versionName."
            exit 1
          fi

          if [ -z "$CURRENT_VERSION_CODE" ]; then
            echo "Could not read versionCode."
            exit 1
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid versionName: $CURRENT_VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version_code=$CURRENT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT_VERSION"
          echo "Current versionCode: $CURRENT_VERSION_CODE"
          echo "Next version: $NEW_VERSION"
          echo "Next versionCode: $NEW_VERSION_CODE"

      - name: Prepare release version
        shell: bash
        run: |
          set -e

          BUILD_FILE="android/app/build.gradle"
          NEW_VERSION="${{ steps.current_version.outputs.version }}"
          NEW_VERSION_CODE="${{ steps.current_version.outputs.version_code }}"

          sed -i -E \
            "s/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEW_VERSION_CODE}/" \
            "$BUILD_FILE"

          sed -i -E \
            "s/(versionName[[:space:]]*=[[:space:]]*)\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"${NEW_VERSION}\"/" \
            "$BUILD_FILE"

          echo "Release version prepared:"
          grep -E "version(Code|Name)" "$BUILD_FILE"

      - name: Clean build
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not generated."
            echo "Available output files:"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-center-${{ steps.current_version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.current_version.outputs.version }}
          name: Stellar Center v${{ steps.current_version.outputs.version }}
          body: |
            # Stellar Center v${{ steps.current_version.outputs.version }}

            Native Android release.

            - Kotlin
            - Jetpack Compose
            - Android Gradle Plugin
            - Android API 37
            - Release APK
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true

      - name: Commit successful version bump
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/build.gradle

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: bump version to ${{ steps.current_version.outputs.version }} [skip ci]"

          git push
