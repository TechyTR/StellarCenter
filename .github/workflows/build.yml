name: Build APK and Linux Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          if [ -z "$VERSION" ]; then
            echo "Version could not be detected."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building Stellar Center v$VERSION"

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk


  # ============================================================
  # LINUX / PARDUS 23
  # ============================================================

  linux:
    name: Build Linux x64 / Pardus 23
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            xz-utils \
            zip \
            tar \
            file \
            ca-certificates \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            dpkg-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.24.0
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 3.24.0 \
            https://github.com/flutter/flutter.git \
            /opt/flutter

          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"

          flutter config --enable-linux-desktop

          flutter --version

      - name: Verify Linux toolchain
        shell: bash
        run: |
          set -e

          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"

          flutter doctor -v

      - name: Prepare Linux platform
        shell: bash
        run: |
          set -e

          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"

          if [ ! -d "linux" ]; then
            flutter create \
              --platforms=linux \
              --project-name=stellarcenter \
              .
          fi

      - name: Get dependencies
        shell: bash
        run: |
          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"

          flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          if [ -z "$VERSION" ]; then
            echo "Version could not be detected."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building Stellar Center Linux v$VERSION"

      - name: Build Linux x64
        shell: bash
        run: |
          set -e

          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"

          flutter clean
          flutter pub get

          flutter build linux --release

      - name: Verify Linux binary
        shell: bash
        run: |
          set -e

          BUNDLE="build/linux/x64/release/bundle"

          test -d "$BUNDLE"
          test -f "$BUNDLE/stellarcenter"

          echo "Linux binary:"
          file "$BUNDLE/stellarcenter"

          echo ""
          echo "Bundle:"
          ls -lah "$BUNDLE"

      # ------------------------------------------------------------
      # TAR.GZ
      # ------------------------------------------------------------

      - name: Create Linux TAR.GZ
        shell: bash
        run: |
          set -e

          tar -czf \
            stellar-center-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle \
            .

          test -f stellar-center-linux-x64.tar.gz

          ls -lh stellar-center-linux-x64.tar.gz

      - name: Upload Linux TAR.GZ
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-linux-${{ steps.version.outputs.version }}
          path: stellar-center-linux-x64.tar.gz

      # ------------------------------------------------------------
      # DEB
      # ------------------------------------------------------------

      - name: Create Debian package
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          rm -rf deb-package

          mkdir -p \
            "deb-package/DEBIAN" \
            "deb-package/opt/stellarcenter" \
            "deb-package/usr/share/applications" \
            "deb-package/usr/share/icons/hicolor/256x256/apps"

          cp -a \
            build/linux/x64/release/bundle/. \
            "deb-package/opt/stellarcenter/"

          cat > "deb-package/DEBIAN/control" <<EOF
          Package: stellarcenter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: TechyTR
          Depends: libc6, libgtk-3-0
          Description: Stellar Center
           Stellar Center system utility application for Linux and Pardus.
          EOF

          cat > "deb-package/usr/share/applications/stellarcenter.desktop" <<EOF
          [Desktop Entry]
          Name=Stellar Center
          Comment=Stellar Center system utility application
          Exec=/opt/stellarcenter/stellarcenter
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          if [ -f "assets/icon.png" ]; then
            cp \
              assets/icon.png \
              "deb-package/usr/share/icons/hicolor/256x256/apps/stellarcenter.png"
          fi

      - name: Build DEB
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-package \
            "stellar-center_${VERSION}_amd64.deb"

      - name: Verify DEB
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          DEB="stellar-center_${VERSION}_amd64.deb"

          test -f "$DEB"

          dpkg-deb --info "$DEB"

          echo ""
          echo "DEB:"
          ls -lh "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: stellarcenter-deb-${{ steps.version.outputs.version }}
          path: stellar-center_${{ steps.version.outputs.version }}_amd64.deb


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - android
      - linux

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          if [ -z "$VERSION" ]; then
            echo "Version could not be detected."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-apk-${{ steps.version.outputs.version }}
          path: release/apk

      - name: Download Linux TAR.GZ
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-linux-${{ steps.version.outputs.version }}
          path: release/linux

      - name: Download Linux DEB
        uses: actions/download-artifact@v4
        with:
          name: stellarcenter-deb-${{ steps.version.outputs.version }}
          path: release/deb

      - name: Verify release files
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          test -f release/apk/app-release.apk
          test -f release/linux/stellar-center-linux-x64.tar.gz
          test -f "release/deb/stellar-center_${VERSION}_amd64.deb"

          echo "Release files:"
          find release -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}

          body: |
            # Stellar Center v${{ steps.version.outputs.version }}

            ## Android
            - APK

            ## Linux
            - x64 TAR.GZ
            - Debian/Pardus AMD64 DEB

            ## Compatibility
            Linux binaries are compiled using Debian 12
            for compatibility with Pardus 23.

          files: |
            release/apk/app-release.apk
            release/linux/stellar-center-linux-x64.tar.gz
            release/deb/stellar-center_${{ steps.version.outputs.version }}_amd64.deb

          make_latest: true
          overwrite_files: true
