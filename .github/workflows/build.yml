name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Read current version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update pubspec version
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          NEW="${{ steps.version.outputs.new }}"

          sed -i "s/^version: ${CURRENT}/version: ${NEW}/" pubspec.yaml

          echo "Updated pubspec.yaml:"
          grep '^version:' pubspec.yaml

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/StellarCenter-${{ steps.version.outputs.new }}.apk"

          ls -lh release/

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "ch
