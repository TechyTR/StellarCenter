name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          set -e

          PASSWORD="$(openssl rand -base64 32)"

          keytool -genkeypair -v \
            -keystore stellar-release.jks \
            -alias stellar_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Stellar Center, OU=Stellar, O=TechyTR, L=Istanbul, ST=Istanbul, C=TR"

          base64 -w 0 stellar-release.jks > stellar-release-base64.txt

          echo "STELLAR_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_STEP_SUMMARY"
          echo "STELLAR_KEY_ALIAS=stellar_release" >> "$GITHUB_STEP_SUMMARY"
          echo "STELLAR_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: stellar-release-keystore
          path: |
            stellar-release.jks
            stellar-release-base64.txt
          retention-days: 1
