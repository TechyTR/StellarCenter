plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.nevruz.stellarcenter"

    compileSdk = flutter.compileSdkVersion

    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.nevruz.stellarcenter"

        minSdk = 23
        targetSdk = flutter.targetSdkVersion

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("STELLAR_KEYSTORE_PATH")
            def keystorePassword = System.getenv("STELLAR_KEYSTORE_PASSWORD")
            def stellarKeyAlias = System.getenv("STELLAR_KEY_ALIAS")
            def stellarKeyPassword = System.getenv("STELLAR_KEY_PASSWORD")

            if (keystorePath == null ||
                keystorePassword == null ||
                stellarKeyAlias == null ||
                stellarKeyPassword == null) {
                throw new GradleException(
                    "Android release signing secrets are missing."
                )
            }

            storeFile = file(keystorePath)
            storePassword = keystorePassword
            keyAlias = stellarKeyAlias
            keyPassword = stellarKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

