plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "org.test.thislinux"

    compileSdk = flutter.compileSdkVersion

    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "org.test.thislinux"

        minSdk = 23
        targetSdk = flutter.targetSdkVersion

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("STELLAR_KEYSTORE_PATH")
            def keystorePassword = System.getenv("STELLAR_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("STELLAR_KEY_ALIAS")
            def keyPassword = System.getenv("STELLAR_KEY_PASSWORD")

            if (keystorePath != null &&
                keystorePassword != null &&
                keyAlias != null &&
                keyPassword != null) {

                storeFile = file(keystorePath)
                storePassword = keystorePassword
                this.keyAlias = keyAlias
                this.keyPassword = keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

