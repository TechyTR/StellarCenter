name: Flutter localization and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/global-localization]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
