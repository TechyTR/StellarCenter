name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Stellar Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-37.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify native Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Native Kotlin Android project detected."

      - name: Clean build
        working-directory: android
        shell: bash
        run: |
          gradle clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not generated."
            echo "Available output files:"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            android/app/build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from android/app/build.gradle"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-center-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}
          body: |
            # Stellar Center v${{ steps.version.outputs.version }}

            Native Android release.

            - Kotlin
            - Jetpack Compose
            - Android Gradle Plugin
            - Release APK

          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true

           - name: ChatGPT Reviewer
            uses: feiskyer/ChatGPT-Reviewer@v0.8
            - name: chatgpt-action
  # You may pin to the exact commit or the version.
  # uses: unsafecoerce/chatgpt-action@df5b73b6f2d8b7f16a51de0f2f3810bd320b053e
  uses: unsafecoerce/chatgpt-action@release/v2
  with:
    # The action to run, currently can be "review", "score"
    action: # optional, default is review
    # Enable debug mode
    debug: # optional
    # The path filters, e.g., "src/**.py", "!dist/**", each line will be considered as one pattern.
See also

- https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
- https://github.com/isaacs/minimatch

    path_filters: # optional, default is !dist/**
!**/package-lock.json

    # The URL of the chatgpt reverse proxy, see also https://github.com/transitive-bullshit/chatgpt-api#reverse-proxy

    chatgpt_reverse_proxy: # optional, default is https://chat.duti.tech/api/conversation
    # Leave comments even the patch is LGTM
    review_comment_lgtm: # optional
    # The beginning prompt of a code review dialog
    review_beginning: # optional, default is Hi ChatGPT, I have a pull request with title "$title" and the description is as follows,

> $description.

Next, I will given you a series of patches, each of them consists of a filename and a diff
snippet, and you need to do a brief code review for every message, and tell me any bug risk
and improvement suggestion. If the patch is looks good and acceptable, please reply "LGTM!"
with a short comment with 30 words.

You answer should be concise. Don't include the diff in your comment, and markdown format is
preferred. Reply "OK" to confirm.

    # The prompt for each chunks/patches
    review_patch: # optional, default is $filename

```diff
$patch
```

    # The prompt for the whole pull request
    scoring_beginning: # optional, default is Hi ChatGPT, I have a pull request with title "$title" and the description is as follows,

> $description

I would like score the pull request, the score should be a number between 0 and 100
and 85 means the the pull request is basically acceptable. You just need to reply a
number between 0 and 100, e.g., "85", and a comment within 30 words. Next, I would
give you the whole diff of the pull request. Reply "OK" to confirm.

    # The prompt for the whole diff for scoring
    scoring: # optional, default is The diff is as follows:

```diff
$diff
```
