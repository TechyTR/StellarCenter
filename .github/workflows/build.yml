name: Stellar Center Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - development
      - codex
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Android keystore
        shell: bash
        run: |
          mkdir -p android/keystore

          echo "${{ secrets.STELLAR_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/keystore/stellar-release.jks

          test -s android/keystore/stellar-release.jks

      - name: Build Android APK
        env:
          STELLAR_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/stellar-release.jks
          STELLAR_KEYSTORE_PASSWORD: ${{ secrets.STELLAR_KEYSTORE_PASSWORD }}
          STELLAR_KEY_ALIAS: ${{ secrets.STELLAR_KEY_ALIAS }}
          STELLAR_KEY_PASSWORD: ${{ secrets.STELLAR_KEY_PASSWORD }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "stellar-center-${{ steps.version.outputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: stellar-center-android-${{ steps.version.outputs.version }}
          path: stellar-center-${{ steps.version.outputs.version }}.apk


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    # Debian 12 uses GLib 2.74.x.
    # This prevents binaries from requiring
    # g_once_init_enter_pointer (introduced in GLib 2.80).
    container:
      image: debian:12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          apt-get update

          apt-get install -y \
            git \
            curl \
            ca-certificates \
            unzip \
            xz-utils \
            zip \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            dpkg-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      - name: Install Flutter
        run: |
          git clone \
            --depth 1 \
            --branch 3.24.0 \
            https://github.com/flutter/flutter.git \
            /opt/flutter

          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Verify GLib version
        run: |
          echo "GLib version:"
          pkg-config --modversion glib-2.0

      - name: Generate Linux desktop project
        run: |
          flutter create \
            --platforms=linux \
            --project-name stellarcenter \
            --no-pub \
            .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        run: |
          flutter clean
          flutter pub get
          flutter build linux --release

      - name: Check Linux binary dependencies
        run: |
          echo "Checking main binary dependencies..."

          ldd build/linux/x64/release/bundle/stellarcenter \
            | tee /tmp/stellarcenter-ldd.txt

          if grep -q "not found" /tmp/stellarcenter-ldd.txt; then
            echo "ERROR: Missing Linux shared library dependency."
            exit 1
          fi

      - name: Check GLib symbol references
        run: |
          echo "Checking for g_once_init_enter_pointer references..."

          if grep -RIl \
            "g_once_init_enter_pointer" \
            build/linux/x64/release/bundle \
            2>/dev/null; then

            echo "WARNING: g_once_init_enter_pointer reference found."
          else
            echo "OK: No direct g_once_init_enter_pointer reference found."
          fi

      - name: Create Linux tar.gz
        run: |
          tar -czf \
            "stellar-center-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Create Linux .deb
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf debian-package

          mkdir -p \
            "debian-package/DEBIAN" \
            "debian-package/opt/stellarcenter" \
            "debian-package/usr/share/applications"

          cp -r \
            build/linux/x64/release/bundle/. \
            debian-package/opt/stellarcenter/

          cat > debian-package/DEBIAN/control <<EOF
          Package: stellarcenter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: TechyTR
          Description: Stellar Center system utility application
          EOF

          cat > debian-package/usr/share/applications/stellarcenter.desktop <<EOF
          [Desktop Entry]
          Name=Stellar Center
          Comment=Stellar Center system utility application
          Exec=/opt/stellarcenter/stellarcenter
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          dpkg-deb \
            --build \
            debian-package \
            "stellar-center-${VERSION}-amd64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stellar-center-linux-${{ steps.version.outputs.version }}
          path: |
            stellar-center-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            stellar-center-${{ steps.version.outputs.version }}-amd64.deb


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - linux

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          pattern: stellar-center-android-*
          path: release
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: stellar-center-linux-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            release/*.apk \
            release/*.tar.gz \
            release/*.deb \
            --title "Stellar Center ${TAG#v}" \
            --generate-notes \
            --latest
