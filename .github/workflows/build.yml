name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Stellar Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify native Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Native Kotlin Android project detected."

      - name: Clean build
        working-directory: android
        shell: bash
        run: |
          gradle clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK was not generated."
            echo "Available output files:"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            android/app/build.gradle | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from android/app/build.gradle"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-center-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stellar Center v${{ steps.version.outputs.version }}
          body: |
            # Stellar Center v${{ steps.version.outputs.version }}

            Native Android release.

            - Kotlin
            - Jetpack Compose
            - Android Gradle Plugin
            - Release APK

          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true
