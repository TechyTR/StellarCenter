name: Stellar Center Android Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;28.2.13676358"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-center-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

