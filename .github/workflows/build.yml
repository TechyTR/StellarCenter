name: Stellar Center Android Release

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Check Gradle
        run: gradle --version

      - name: Read current version
        id: current_version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle | head -1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')

          if [ -z "$VERSION_NAME" ]; then
            echo "versionName bulunamadı."
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "versionCode bulunamadı."
            exit 1
          fi

          echo "Mevcut versionName: $VERSION_NAME"
          echo "Mevcut versionCode: $VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next_version
        shell: bash
        run: |
          VERSION_NAME="${{ steps.current_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.current_version.outputs.version_code }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          echo "Yeni versionName: $NEW_VERSION"
          echo "Yeni versionCode: $NEW_VERSION_CODE"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Update Android version
        env:
          NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
          NEW_VERSION_CODE: ${{ steps.next_version.outputs.new_version_code }}
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          new_version = os.environ["NEW_VERSION"]
          new_version_code = os.environ["NEW_VERSION_CODE"]

          text, version_name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{new_version}"',
              text,
              count=1
          )

          text, version_code_count = re.subn(
              r'versionCode\s*=\s*[0-9]+',
              f'versionCode = {new_version_code}',
              text,
              count=1
          )

          if version_name_count != 1:
              raise SystemExit(
                  f"versionName değiştirilemedi. Bulunan: {version_name_count}"
              )

          if version_code_count != 1:
              raise SystemExit(
                  f"versionCode değiştirilemedi. Bulunan: {version_code_count}"
              )

          path.write_text(text)
          PY

          echo "Güncel Android sürümü:"
          grep -E 'version(Code|Name)\s*=' app/build.gradle

      - name: Clean
        run: gradle clean --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          echo "Oluşturulan APK:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "APK başarıyla oluşturuldu."

      - name: Commit version bump
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android/app/build.gradle

          if git diff --cached --quiet; then
            echo "Version değişikliği bulunamadı."
          else
            git commit \
              -m "chore: bump version to ${NEW_VERSION} [skip ci]"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.next_version.outputs.new_version }}
          name: Stellar Center v${{ steps.next_version.outputs.new_version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
        run: |
          echo "======================================"
          echo " Stellar Center Release Başarılı"
          echo " Version: ${NEW_VERSION}"
          echo " Tag: v${NEW_VERSION}"
          echo " APK: GitHub Release'e yüklendi"
          echo "======================================"

