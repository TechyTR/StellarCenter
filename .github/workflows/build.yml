name: Stellar Center Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - development
      - codex
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Stellar Center version: $VERSION"

      - name: Prepare Android keystore
        shell: bash
        run: |
          mkdir -p android/keystore

          echo "${{ secrets.STELLAR_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/keystore/stellar-release.jks

          test -s android/keystore/stellar-release.jks

      - name: Build Android APK
        env:
          STELLAR_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/stellar-release.jks
          STELLAR_KEYSTORE_PASSWORD: ${{ secrets.STELLAR_KEYSTORE_PASSWORD }}
          STELLAR_KEY_ALIAS: ${{ secrets.STELLAR_KEY_ALIAS }}
          STELLAR_KEY_PASSWORD: ${{ secrets.STELLAR_KEY_PASSWORD }}
        run: |
          flutter clean
          flutter pub get

          dart run flutter_launcher_icons

          flutter build apk \
            --release \
            -t lib/main/main_android.dart

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "stellar-center-${{ steps.version.outputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: stellar-center-android-${{ steps.version.outputs.version }}
          path: stellar-center-${{ steps.version.outputs.version }}.apk


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          apt-get update

          apt-get install -y \
            git \
            curl \
            ca-certificates \
            unzip \
            xz-utils \
            zip \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            dpkg-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      - name: Install Flutter
        run: |
          git clone \
            --depth 1 \
            --branch 3.24.0 \
            https://github.com/flutter/flutter.git \
            /opt/flutter

          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # ----------------------------------------------------------
      # IMPORTANT:
      # Do NOT overwrite an existing Linux project.
      # ----------------------------------------------------------

      - name: Generate Linux desktop project if missing
        shell: bash
        run: |
          if [ ! -d "linux" ]; then
            echo "Linux project does not exist."
            echo "Generating Linux project..."

            flutter create \
              --platforms=linux \
              --project-name stellarcenter \
              --no-pub \
              .
          else
            echo "Existing Linux project found."
            echo "Keeping repository Linux project."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Stellar Center version: $VERSION"

      - name: Prepare Linux icon directories
        shell: bash
        run: |
          mkdir -p \
            linux/icons/hicolor/16x16/apps \
            linux/icons/hicolor/24x24/apps \
            linux/icons/hicolor/32x32/apps \
            linux/icons/hicolor/48x48/apps \
            linux/icons/hicolor/64x64/apps \
            linux/icons/hicolor/128x128/apps \
            linux/icons/hicolor/256x256/apps \
            linux/icons/hicolor/512x512/apps \
            linux/icons/hicolor/1024x1024/apps

          test -f assets/icon.png

      - name: Build Linux
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          flutter clean
          flutter pub get

          flutter build linux \
            --release \
            -t lib/main/main_linux.dart \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"

      - name: Check Linux binary dependencies
        run: |
          echo "Checking main binary dependencies..."

          ldd build/linux/x64/release/bundle/stellarcenter \
            | tee /tmp/stellarcenter-ldd.txt

          if grep -q "not found" /tmp/stellarcenter-ldd.txt; then
            echo "ERROR: Missing Linux shared library dependency."
            exit 1
          fi

      - name: Check GLib symbol references
        run: |
          echo "Checking for g_once_init_enter_pointer references..."

          if grep -RIl \
            "g_once_init_enter_pointer" \
            build/linux/x64/release/bundle \
            2>/dev/null; then

            echo "WARNING: g_once_init_enter_pointer reference found."
          else
            echo "OK: No direct g_once_init_enter_pointer reference found."
          fi

      # ----------------------------------------------------------
      # Prepare Debian package
      # ----------------------------------------------------------

      - name: Create Linux .deb
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf debian-package

          mkdir -p \
            "debian-package/DEBIAN" \
            "debian-package/opt/stellarcenter" \
            "debian-package/usr/share/applications" \
            "debian-package/usr/share/icons/hicolor/16x16/apps" \
            "debian-package/usr/share/icons/hicolor/24x24/apps" \
            "debian-package/usr/share/icons/hicolor/32x32/apps" \
            "debian-package/usr/share/icons/hicolor/48x48/apps" \
            "debian-package/usr/share/icons/hicolor/64x64/apps" \
            "debian-package/usr/share/icons/hicolor/128x128/apps" \
            "debian-package/usr/share/icons/hicolor/256x256/apps" \
            "debian-package/usr/share/icons/hicolor/512x512/apps" \
            "debian-package/usr/share/icons/hicolor/1024x1024/apps"

          cp -r \
            build/linux/x64/release/bundle/. \
            debian-package/opt/stellarcenter/

          # ------------------------------------------------------
          # Install application icon in all common hicolor sizes.
          #
          # The source icon remains the original assets/icon.png.
          # ImageMagick is installed below only for resizing.
          # ------------------------------------------------------

          apt-get update
          apt-get install -y imagemagick

          for SIZE in 16 24 32 48 64 128 256 512 1024; do
            convert \
              assets/icon.png \
              -resize "${SIZE}x${SIZE}" \
              -strip \
              "debian-package/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps/stellarcenter.png"
          done

          # ------------------------------------------------------
          # Desktop launcher
          # ------------------------------------------------------

          cat > \
            debian-package/usr/share/applications/stellarcenter.desktop \
            <<EOF
          [Desktop Entry]
          Name=Stellar Center
          GenericName=Stellar Center
          Comment=Stellar Center system utility application
          Exec=/opt/stellarcenter/stellarcenter
          Icon=stellarcenter
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupNotify=true
          StartupWMClass=stellarcenter
          EOF

          # ------------------------------------------------------
          # Debian package metadata
          # ------------------------------------------------------

          cat > debian-package/DEBIAN/control <<EOF
          Package: stellarcenter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: TechyTR
          Description: Stellar Center system utility application
          EOF

          # ------------------------------------------------------
          # Update desktop icon cache when available.
          # ------------------------------------------------------

          mkdir -p \
            debian-package/usr/share/icons/hicolor

          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache \
              -f \
              -t \
              debian-package/usr/share/icons/hicolor \
              || true
          fi

          # ------------------------------------------------------
          # Build DEB
          # ------------------------------------------------------

          dpkg-deb \
            --build \
            debian-package \
            "stellar-center-${VERSION}-amd64.deb"

      - name: Create Linux tar.gz
        run: |
          tar -czf \
            "stellar-center-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stellar-center-linux-${{ steps.version.outputs.version }}
          path: |
            stellar-center-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            stellar-center-${{ steps.version.outputs.version }}-amd64.deb


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - linux

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG"

      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            echo "Creating tag ${TAG}..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          pattern: stellar-center-android-*
          path: release
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: stellar-center-linux-*
          path: release
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          echo "Release files:"
          find release -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "Uploading/replacing artifacts..."

            gh release upload "$TAG" \
              release/*.apk \
              release/*.tar.gz \
              release/*.deb \
              --clobber
          else
            echo "Creating GitHub Release ${TAG}..."

            gh release create "$TAG" \
              release/*.apk \
              release/*.tar.gz \
              release/*.deb \
              --title "Stellar Center ${VERSION}" \
              --generate-notes \
              --latest
          fi

      - name: Release completed
        run: |
          echo "========================================"
          echo "Stellar Center Release completed"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.tag.outputs.tag }}"
          echo "========================================"
